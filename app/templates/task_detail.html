{% extends "base.html" %}

{% block content %}
<div class="container">
  <h1 class="text-center my-4">Task Details</h1>
  <div class="card task-card">
    <div class="card-body">
      <h5 class="card-title">{{ task.title }}</h5>
      <p class="card-text">{{ task.description }}</p>
      <div class="task-actions">
        <a href="{{ url_for('main.edit_task', project_id=task.project_id, task_id=task.id) }}" class="btn btn-warning btn-sm">Edit</a>
        <form action="{{ url_for('main.delete_task', project_id=task.project_id, task_id=task.id) }}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
