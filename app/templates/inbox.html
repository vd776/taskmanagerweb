{% extends "base.html" %}

{% block content %}
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.container {
  max-width: 800px;
}

.card {
  border: none;
}

.card-title {
  font-size: 1.5rem;
  margin-bottom: 1rem;
}

.list-group-item {
  border: none;
  padding: 1rem;
  border-bottom: 1px solid #e0e0e0;
}

.btn-sm {
  margin-left: 0.5rem;
}

a {
  text-decoration: none;
  color: #007bff;
}

a:hover {
  text-decoration: underline;
}
</style>
<div class="container mt-5">
  <h1 class="text-center my-4">Inbox</h1>
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h3 class="card-title">Pending Invitations</h3>
      <ul class="list-group list-group-flush">
        {% if invitations %}
            {% for invitation in invitations %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <strong>Project:</strong>
                <a href="{{ url_for('main.project_detail', project_id=invitation.project.id) }}">
                  {{ invitation.project.name }}
                </a>
              </div>
              <div>
                <form action="{{ url_for('main.accept_invitation', invitation_id=invitation.id) }}" method="post" style="display:inline;">
                  <button type="submit" class="btn btn-success btn-sm">Accept</button>
                </form>
                <form action="{{ url_for('main.decline_invitation', invitation_id=invitation.id) }}" method="post" style="display:inline;">
                  <button type="submit" class="btn btn-danger btn-sm">Decline</button>
                </form>
              </div>
            </li>
            {% endfor %}
        {% endif %}
        {% if not invitations %}
             <p>Empty..</p>
        {% endif %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
