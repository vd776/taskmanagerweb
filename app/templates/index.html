{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="height: 80vh;">
  <div class="text-center">
    <h1 class="display-4 mb-4">Welcome to Task Manager</h1>
    {% if current_user.is_authenticated %}
      <p class="lead">Manage your tasks and projects efficiently.</p>
      <a href="{{ url_for('main.projects') }}" class="btn btn-primary btn-lg mx-2">View Projects</a>
    {% else %}
      <p class="lead">Organize your tasks and manage projects effortlessly.</p>
      <a href="{{ url_for('main.register') }}" class="btn btn-primary btn-lg mx-2">Register</a>
      <a href="{{ url_for('main.login_custom') }}" class="btn btn-secondary btn-lg mx-2">Login</a>
    {% endif %}
  </div>
</div>
{% endblock %}
